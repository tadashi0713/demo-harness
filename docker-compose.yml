services:
  db:
    image: postgres:16-alpine
    container_name: atlasbank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlasbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlasbank}
      POSTGRES_DB: ${POSTGRES_DB:-atlasbank}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlasbank} -d ${POSTGRES_DB:-atlasbank}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
    container_name: atlasbank-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-atlasbank}:${POSTGRES_PASSWORD:-atlasbank}@db:5432/${POSTGRES_DB:-atlasbank}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SEED_DEMO_DATA: "true"
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # ブラウザから叩く URL なので localhost（ホスト側）を指定する
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: atlasbank-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  db-data:
