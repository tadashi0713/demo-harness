services:
  db:
    image: postgres:16-alpine
    container_name: atlasbank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlasbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlasbank}
      POSTGRES_DB: ${POSTGRES_DB:-atlasbank}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlasbank} -d ${POSTGRES_DB:-atlasbank}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
    container_name: atlasbank-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-atlasbank}:${POSTGRES_PASSWORD:-atlasbank}@db:5432/${POSTGRES_DB:-atlasbank}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      SEED_DEMO_DATA: "true"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
